id = "k-rutkowski/spacewatch"
name = "Spacewatch"
version = "0.1.0"
plugin_api = 22
author = "Krzysztof Rutkowski"
license = "WTFPL"
icon = "disk"
description = "Warns when a filesystem is running low on free space."
tags = ["system", "bar", "service", "utility"]
dependencies = []

[[setting]]
key = "warning_threshold"
type = "int"
label_key = "settings.warning_threshold.label"
description_key = "settings.warning_threshold.description"
default = 85
min = 1
max = 100

[[setting]]
key = "critical_threshold"
type = "int"
label_key = "settings.critical_threshold.label"
description_key = "settings.critical_threshold.description"
default = 95
min = 1
max = 100

[[setting]]
key = "poll_seconds"
type = "int"
label_key = "settings.poll_seconds.label"
description_key = "settings.poll_seconds.description"
default = 30
min = 10
max = 3600

[[setting]]
key = "notify_recovery"
type = "bool"
label_key = "settings.notify_recovery.label"
description_key = "settings.notify_recovery.description"
default = true

[[setting]]
key = "filesystems"
type = "string_list"
label_key = "settings.filesystems.label"
description_key = "settings.filesystems.description"
default = [ "/" ]

[[service]]
id = "monitor"
entry = "service.luau"

[[widget]]
id = "status"
entry = "widget.luau"
